<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

.t-mono{font-family:'IBM Plex Mono',monospace;font-weight:500;}

.app{max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
main{flex:1;padding:28px 20px 72px;}
header.top{background:var(--navy-800);border-bottom:1px solid var(--line-heavy);padding:16px 20px 0;position:sticky;top:0;z-index:40;}

.brand-text span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-top:1px;}
.lang-btn{background:var(--navy-600);border:1px solid var(--line-heavy);color:var(--text-secondary);border-radius:999px;padding:5px 13px;font-size:11px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;}
.lang-btn:hover{background:var(--navy-500);color:var(--text-primary);}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{background:none;border:none;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;border-radius:6px 6px 0 0;}

.card{background:var(--navy-700);border:1px solid var(--line-heavy);border-radius:var(--r-xl);padding:24px;margin-bottom:16px;}

.card.hero-card{background:linear-gradient(135deg,var(--navy-600) 0%,var(--navy-700) 60%,var(--navy-800) 100%);border-color:var(--line-mid);}

.card.ok-tint{background:var(--ok-bg);border-color:rgba(61,170,110,.2);}
.card.warn-tint{background:var(--warn-bg);border-color:rgba(196,149,74,.2);}

label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.03em;margin:16px 0 6px;}
input,select,textarea{width:100%;padding:11px 14px;background:var(--navy-800);border:1px solid var(--line-heavy);border-radius:var(--r-md);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:14px;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel-400);box-shadow:0 0 0 3px rgba(74,144,196,.12);}

select option{background:var(--navy-800);}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:11px 22px;transition:all .15s;}

.btn-secondary{background:var(--navy-600);color:var(--text-secondary);border:1px solid var(--line-heavy);}

.msg.ok{background:var(--ok-bg);color:#6DD8A0;border:1px solid rgba(61,170,110,.25);}

@media print{header.top,footer.site,.subnav{display:none;}}
</style>

/* ======== SECURITY: Rate limiting ======== */
const RATE={_c:{},check(k,max,ms){const n=Date.now();if(!this._c[k])this._c[k]=[];this._c[k]=this._c[k].filter(t=>n-t<ms);if(this._c[k].length>=max)return false;this._c[k].push(n);return true;}};

/* ======== PIN hashing (SHA-256) ======== */
async function hashPIN(pin,salt){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(pin+(salt||'PPP2026')));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ======== Lockout helpers ======== */
function isLocked(id){const lo=state.lockouts&&state.lockouts[id];if(!lo)return false;if(Date.now()<lo.until)return lo.until;delete state.lockouts[id];return false;}
async function recFail(id){if(!state.lockouts)state.lockouts={};const lo=state.lockouts[id]||{count:0,until:0};lo.count++;if(lo.count>=5){lo.until=Date.now()+15*60*1000;lo.count=0;}state.lockouts[id]=lo;await sset('pin-lockouts',state.lockouts);}
async function clrLock(id){if(!state.lockouts)state.lockouts={};delete state.lockouts[id];await sset('pin-lockouts',state.lockouts);}
function pinSessionOk(){return state.pinSession&&state.pinSession.expires>Date.now();}

/* ---------- Storage helpers (shared — public pilot data) ---------- */
/* Browser-lagring: window.storage findes kun i Claudes eget forhåndsvisningsmiljø.
   På den rigtige, offentlige side findes den slet ikke — uden dette lag fejlede
   ALLE lokale gem-funktioner stille i baggrunden for rigtige besøgende. */
if (!window.storage) {
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem('ppp_store_'+key);
      if (raw === null) throw new Error('key not found');
      return {key, value: raw, shared: !!shared};
    },
    async set(key, value, shared){
      localStorage.setItem('ppp_store_'+key, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const existed = localStorage.getItem('ppp_store_'+key) !== null;
      localStorage.removeItem('ppp_store_'+key);
      return {key, deleted: existed, shared: !!shared};
    },
    async list(prefix, shared){
      const keys = [];
      for (let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf('ppp_store_')===0){
          const kk = k.slice('ppp_store_'.length);
          if (!prefix || kk.indexOf(prefix)===0) keys.push(kk);
        }
      }
      return {keys, prefix, shared: !!shared};
    }
  };
}
const SKEY = {
  members:"members", contacts:"region-contacts", calendar:"calendar-events",
  collections:"collections", log:"message-log", seq:"member-seq",
  fullreports:"full-haste-reports", settings:"org-settings",
  orgcontainers:"org-containers", orgseq:"org-seq", news:"news-broadcasts", adminToken:"admin-token", adminRole:"admin-role", adminRegion:"admin-region"
};
async function sget(key, fallback){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function sset(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); }catch(e){ console.error("storage error",e); }
}

/* ═══ API ═══ */
const API_URL = 'https://api.piff-paff-puff.dk/api.php';
async function apiCall(action, data={}) {
  try {
    const headers = {'Content-Type': 'application/json'};
    if (state.adminToken) headers['X-Admin-Token'] = state.adminToken;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify({...data, action})
    });
    const r = await res.json();
    if (r && r.code === 'admin_required' && state.adminUnlocked) {
      state.adminUnlocked = false; state.adminToken = null; state.adminRole = null; state.adminRegion = null;
      await sset(SKEY.adminToken, null); await sset(SKEY.adminRole, null); await sset(SKEY.adminRegion, null);
      setTab('admin'); render();
    }
    return r;
  } catch(e) {
    console.error('API fejl:', e);
    return {ok: false, message: 'Netværksfejl — prøv igen.'};
  }
}

async function syncFromAPI() {
  try {
    const [mr, cr, col, fr, qr, sr] = await Promise.all([
      apiCall('get_members'), apiCall('get_calendar'), apiCall('get_collections'),
      apiCall('get_fullreports'), apiCall('get_qrpoints'), apiCall('get_suspicions')
    ]);
    if(mr.ok && mr.members && mr.members.length > 0) {
      state.members = mr.members.map(m=>({
        id:m.id, number:m.number, status:m.status,
        name:m.name, phone:m.phone, email:m.email,
        street:m.street, postal:m.postal, city:m.city,
        region:m.region, regionGroup:m.region_group,
        containerType:m.container_type, storageMode:m.storage_mode,
        smsReminder:!!parseInt(m.sms_reminder), signupDate:m.signup_date,
        opStatus:m.op_status||'green', caseHandled:!!parseInt(m.case_handled),
        responsibleEmail:m.responsible_email||''
      }));
      await sset(SKEY.members, state.members);
    }
    if(cr.ok && cr.calendar) {
      state.calendar = cr.calendar.map(e=>({id:e.id,region:e.region,date:e.event_date,note:e.note}));
      await sset(SKEY.calendar, state.calendar);
    }
    if(col.ok && col.collections) {
      state.collections = col.collections.map(c=>({id:c.id,region:c.region,amount:c.amount,date:c.collection_date,note:c.note,bankRef:c.bank_ref||''}));
      await sset(SKEY.collections, state.collections);
    }
    if(fr.ok && fr.reports) {
      state.fullreports = fr.reports.map(r=>({id:r.id,memberNumber:r.member_number,region:r.region,type:r.type,note:r.note,handled:!!parseInt(r.handled),date:r.created_at}));
      await sset(SKEY.fullreports, state.fullreports);
    }
    if(qr.ok && qr.qrpoints) {
      state.qrpoints = qr.qrpoints.map(p=>({id:p.id,name:p.name,address:p.address,postal:p.postal,city:p.city,region:p.region,autoFullAt:parseInt(p.auto_full_at),count:parseInt(p.count)}));
      await sset('qr-drop-points', state.qrpoints);
    }
    if(sr.ok && sr.suspicions) {
      state.suspicions = sr.suspicions.map(s=>({id:s.id,memberName:s.member_name,memberPhone:s.member_phone,memberNumber:s.member_number,desc:s.description,date:s.created_at}));
    }
    if (state.adminUnlocked && state.adminRole === 'super') {
      const [dr, aar] = await Promise.all([apiCall('get_deletion_requests'), apiCall('super_list_area_admins')]);
      if (dr.ok && dr.requests) state.deletionRequests = dr.requests;
      if (aar.ok && aar.areaAdmins) state.areaAdmins = aar.areaAdmins;
    }
    if(state.loaded) render();

}

const ABOUT_DEFAULTS = {
  formaal_da:"Piff-Paff-Puff er indsamlingsmotoren: vi indsamler pantdonationer i alle Danmarks områder, helt gratis for donorerne. Ingen beholder koster noget at få stillet op. Pantet veksles hos Dansk Retursystem, som overfører pengene videre til os.\n\nPantindsamlingen fra alle områder går til social velfærd og trivsel — bredt, på rigtig mange områder og med mange forskellige hensigter, alt sammen under den sociale organisation Håbet.\n\nDette er et projekt i vision. Det bygges, én sætning ad gangen, med hjælp fra danske borgere, efterhånden som flere tilmelder sig. Piff-Paff-Puff er nu fysisk klar til drift — det er selve appen, der er det sidste stykke af puslespillet. Vores drøm er at færdigudvikle app og organisation, og på sigt overdrage driften af både Håbet og Piff-Paff-Puff til borgerne i de enkelte områder, så hvert område selv ejer og varetager sin del.",

async function loadAll(){
  state.members = await sget(SKEY.members, []);
  state.contacts = await sget(SKEY.contacts, Object.fromEntries(ALL_REGIONS.map(r=>[r.name,""])));
  state.calendar = await sget(SKEY.calendar, []);
  state.collections = await sget(SKEY.collections, []);
  state.log = await sget(SKEY.log, []);
  state.seq = await sget(SKEY.seq, 0);
  state.fullreports = await sget(SKEY.fullreports, []);
  state.orgcontainers = await sget(SKEY.orgcontainers, []);
  state.orgseq = await sget(SKEY.orgseq, 100000);
  state.news = await sget(SKEY.news, []);
  const loaded = await sget(SKEY.settings, null);
  state.settings = {
    ppp: {...state.settings.ppp, ...((loaded && loaded.ppp) || {})},
    haabet: {...state.settings.haabet, ...((loaded && loaded.haabet) || {})},
    hope: {...state.settings.hope, ...((loaded && loaded.hope) || {})},
    youtube: (loaded && typeof loaded.youtube==="string") ? loaded.youtube : state.settings.youtube,
    about: {...ABOUT_DEFAULTS, ...((loaded && loaded.about) || {})},
  };
  state.lockouts = await sget('pin-lockouts', {});
  state.qrpoints = await sget('qr-drop-points', []);
  const savedAdminToken = await sget(SKEY.adminToken, null);
  if (savedAdminToken) {
    state.adminToken = savedAdminToken;
    const r = await apiCall('get_members', {});
    if (r && r.ok) {
      state.adminUnlocked = true;
      state.adminRole = await sget(SKEY.adminRole, 'super');
      state.adminRegion = await sget(SKEY.adminRegion, null);
    } else {
      state.adminToken = null;
      await sset(SKEY.adminToken, null);
    }
  }
  state.loaded = true;
  render();
  // Sync from MySQL in background
  syncFromAPI();
}
function uid(){ return Math.random().toString(36).slice(2,9); }
async function addLog(to, subject, body){
  const entry = {id:uid(), to, subject, body, date:new Date().toISOString()};
  state.log.unshift(entry);
  await sset(SKEY.log, state.log);
}
async function nextMemberNumber(regionName){
  state.seq += 1;
  await sset(SKEY.seq, state.seq);
  return regionCode(regionName) + "-" + String(state.seq).padStart(5,"0");
}
async function nextOrgBaseNumber(){
  state.orgseq += 1;
  await sset(SKEY.orgseq, state.orgseq);
  const s = String(state.orgseq).padStart(6,"0");
  return s.slice(0,3) + "-" + s.slice(3);
}
function findMember(lookup){
  const q = (lookup||"").trim().toLowerCase();
  return state.members.find(m => m.number.toLowerCase()===q || m.email.toLowerCase()===q);
}
function getAppUrl(){
  try{ return window.location.href.split('#')[0].split('?')[0]; }
  catch(e){ return "https://www.piff-paff-puff.dk/"; }
}
function storageLabel(mode){
  if(mode==="egen") return t("storage_egen");
  if(mode==="afdeling") return t("storage_afdeling");
  return t("storage_beholder");
}
function storageLabelShort(mode){
  const l = state.lang;

  return l==="en" ? "Container (delivered)" : "Beholder (leveres)";
}

  if(state.tab==="admin") return state.adminUnlocked ? adminHTML() : gateHTML();

}

function beholderHTML(){
  const sub = state.beholderSub;
  const subs = [["tilmeld",t("bsub_tilmeld")],["afmeld",t("bsub_afmeld")],["opslag",t("bsub_opslag")],["adresse",t("bsub_adresse")],["fuldhaste",t("bsub_fuldhaste")],["bestilnr",t("bsub_bestilnr")],["storindsamling",t("bsub_storindsamling")]];
  return `
  <div class="subnav">${subs.map(([id,l])=>`<button data-bsub="${id}" class="${sub===id?'active':''}">${l}</button>`).join("")}</div>
  ${sub==="tilmeld" ? tilmeldHTML() : ""}
  ${sub==="afmeld" ? afmeldHTML() : ""}
  ${sub==="opslag" ? opslagHTML() : ""}
  ${sub==="adresse" ? adresseHTML() : ""}
  ${sub==="fuldhaste" ? fuldHasteHTML() : ""}
  ${sub==="bestilnr" ? bestilNrHTML() : ""}
  ${sub==="storindsamling" ? storindsamlingHTML() : ""}
  `;
}

function containerTypeOptions(prefix){
  const l = state.lang;
  return CONTAINER_TYPES.map(([id,label,desc],i)=>`
    <label class="opt-label"><input type="radio" name="${prefix}" value="${id}" ${i===0?"checked":""}/> <span><b>${label[l]}</b><br><span style="font-size:11px;color:#8a8270;">${desc[l]}</span></span></label>
  `).join("");
}

        <div><label>Telefon</label><input required name="phone" placeholder="12 34 56 78"/></div>

/* ---------- KALENDER ---------- */
function kalenderHTML(){
  const regionFilter = state.calFilter || "";
  const events = [...state.calendar].filter(e=> !regionFilter || e.region===regionFilter).sort((a,b)=> new Date(a.date)-new Date(b.date));
  return `
  <div class="card">
    <span class="eyebrow">${t("kal_eyebrow")}</span>
    <h2 style="font-size:21px;margin-bottom:10px;">${t("kal_h")}</h2>
    <label>${t("lbl_region")}</label>
    <select id="cal-region-filter">
      <option value="">${t("opt_allregions")}</option>
      ${ALL_REGIONS.map(r=>`<option value="${r.name}" ${regionFilter===r.name?"selected":""}>${r.name} (${r.pc})</option>`).join("")}
    </select>
    <div style="margin-top:16px;">
      <table>
        <thead><tr><th>${t("th_date")}</th><th>${t("th_region")}</th><th>${t("th_note")}</th></tr></thead>
        <tbody>
        ${events.map(e=>`<tr><td class="mono">${new Date(e.date).toLocaleDateString('da-DK')}</td><td>${e.region}</td><td>${e.note||"—"}</td></tr>`).join("") || `<tr><td colspan="3" style="color:#8a8270;">${t("no_dates")}</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <span class="eyebrow">${t("regions_eyebrow")}</span>
    <div class="regions">
      ${ALL_REGIONS.map(r=>{
        const c = state.members.filter(m=>m.region===r.name && m.status==="active").length;
        return `<div class="region-tile ${r.hq?'hq':''}"><div class="grp"><span>${r.group}</span>${r.hq?'<span class="hqtag">HQ</span>':''}</div><div class="name">${r.name}</div><div style="font-size:11px;color:#8a8270;margin-bottom:6px;">Postnr. ${r.pc}</div><div class="count">${c}<span>${t("unit_members")}</span></div></div>`;
      }).join("")}
    </div>
  </div>`;
}

/* ---------- QR-KODER ---------- */
function qrHTML(){
  const p = state.settings.ppp, h = state.settings.haabet, hope = state.settings.hope;
  const sel = state.qrSelected || "app";
  const options = [
    {id:"app", label:t("qr_app"), url:getAppUrl(), available:true},
    {id:"ppp", label:t("qr_ppp"), url:p.website, available:!!p.website},
    {id:"haabet", label:t("qr_haabet"), url:h.website, available:!!h.website},
    {id:"hope", label:t("qr_hope"), url:hope.url, available:!!hope.url},
  ];
  const current = options.find(o=>o.id===sel) || options[0];
  return `
  <div class="card">
    <span class="eyebrow">${t("qr_eyebrow")}</span>
    <h2 style="font-size:21px;">${t("qr_h")}</h2>
    <p>${t("qr_p")}</p>
    <div class="subnav">${options.map(o=>`<button data-qr="${o.id}" class="${sel===o.id?'active':''}">${o.label}</button>`).join("")}</div>
    ${current.available ? `
      <div style="text-align:center;padding:16px 0;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(current.url)}" style="width:5cm;height:5cm;border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;" alt="QR-kode"/>
        <div class="mono" style="margin-top:10px;font-size:12px;color:#8a8270;word-break:break-all;max-width:320px;margin-left:auto;margin-right:auto;">${current.url}</div>
        <button class="btn ghost" id="btn-print-qr" style="margin-top:14px;">${t("btn_print")}</button>
      </div>
    ` : `<div class="msg info">${t("qr_unavailable")}</div>`}
  </div>`;
}

/* ---------- INDSAMLING (public) ---------- */
function indsamlingHTML(){
  const active = state.members.filter(m=>m.status==="active");
  const byRegion = {};
  state.collections.forEach(c=>{ byRegion[c.region]=(byRegion[c.region]||0)+Number(c.amount||0); });
  const total = state.collections.reduce((s,c)=>s+Number(c.amount||0),0);
  const maxAmt = Math.max(1, ...Object.values(byRegion));
  const sorted = [...ALL_REGIONS].sort((a,b)=> (byRegion[b.name]||0)-(byRegion[a.name]||0));
  return `
  <div class="stat-row">
    <div class="stat"><div class="n">${total.toLocaleString('da-DK')} kr</div><div class="l">${t("stat_total_collect")}</div></div>
    <div class="stat"><div class="n">${(byRegion["Fyn (Hovedafdeling)"]||0).toLocaleString('da-DK')} kr</div><div class="l">${t("stat_hq")}</div></div>
    <div class="stat"><div class="n">${active.length}</div><div class="l">${t("stat_active_users")}</div></div>
  </div>
  <div class="card dark">
    <span class="eyebrow">${t("indsamling_eyebrow")}</span>
    ${sorted.map(r=>{
      const amt = byRegion[r.name]||0;
      const pct = Math.max(2, Math.round(amt/maxAmt*100));
      const cnt = active.filter(m=>m.region===r.name).length;
      return `<div class="bar-row"><div class="head"><span>${r.name} <span style="opacity:.6;">· ${cnt} ${t("unit_containers")}</span></span><b>${amt.toLocaleString('da-DK')} kr</b></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
    }).join("")}
  </div>`;
}

/* ---------- Events ---------- */
function bindEvents(){
  root.querySelectorAll("[data-tab]").forEach(el=> el.addEventListener("click", (e)=>{ e.preventDefault(); setTab(el.dataset.tab); }));
  root.querySelectorAll("[data-shortcut]").forEach(el=> el.addEventListener("click", ()=>{
    const [tab,sub] = el.dataset.shortcut.split(":");
    state.tab = tab; if(sub) state.beholderSub = sub;
    render(); window.scrollTo(0,0);
  }));
  root.querySelectorAll("[data-bsub]").forEach(el=> el.addEventListener("click", ()=>{ state.beholderSub = el.dataset.bsub; render(); }));
  root.querySelectorAll("[data-cregion]").forEach(el=> el.addEventListener("click", ()=>{ state.contactRegion = el.dataset.cregion; render(); }));
  root.querySelectorAll("[data-qr]").forEach(el=> el.addEventListener("click", ()=>{ state.qrSelected = el.dataset.qr; render(); }));
  root.querySelectorAll("[data-lang-toggle]").forEach(el=> el.addEventListener("click", ()=>{ state.lang = state.lang==="da" ? "en" : "da"; render(); }));
  root.querySelectorAll("[data-admin]").forEach(el=> el.addEventListener("click", ()=>{
    if(el.dataset.admin==="logout"){
      const t=state.adminToken;
      state.adminUnlocked=false; state.adminToken=null; state.adminRole=null; state.adminRegion=null;
      sset(SKEY.adminToken, null); sset(SKEY.adminRole, null); sset(SKEY.adminRegion, null);
      if(t) apiCall('admin_logout', {});
      setTab("forside"); return;
    }
    state.adminSub = el.dataset.admin; render();
  }));

  const printBtn = root.querySelector("#btn-print-qr");
  if(printBtn) printBtn.addEventListener("click", ()=> window.print());

  const postalInput = root.querySelector('input[name="postal"]');
  if(postalInput){
    postalInput.addEventListener("input", ()=>{
      const r = getRegion(postalInput.value);
      const text = r ? `${state.lang==='en'?'Area':'Område'}: ${r.group} — ${r.name}` : (postalInput.value.length===4 ? (state.lang==='en'?"Postal code not recognised. Please check the number.":"Postnummer ikke genkendt. Tjek venligst nummeret.") : "");
      const prev = root.querySelector("#region-preview");
      if(prev) prev.textContent = text;
    });
  }
  const calFilter = root.querySelector("#cal-region-filter");
  if(calFilter) calFilter.addEventListener("change", ()=>{ state.calFilter = calFilter.value; render(); });

  const orgTypeSel = root.querySelector("#org-type");
  if(orgTypeSel){
    const toggleEvent = ()=>{ const ef = root.querySelector("#event-fields"); if(ef) ef.style.display = orgTypeSel.value==="event" ? "block" : "none"; };
    orgTypeSel.addEventListener("change", toggleEvent);
    toggleEvent();
  }
  const orgQty = root.querySelector("#org-qty");
  if(orgQty){
    const renderPlacements = ()=>{
      const n = Math.max(1, Math.min(50, parseInt(orgQty.value||"1",10)));
      const box = root.querySelector("#org-placements");
      if(!box) return;
      let html = `<label>Placering pr. beholder (valgfrit)</label>`;
      for(let i=1;i<=n;i++){ html += `<input name="placement_${i}" placeholder="Beholder ${i} — fx ved hovedindgang" style="margin-bottom:8px;"/>`; }
      box.innerHTML = html;
    };
    orgQty.addEventListener("input", renderPlacements);
    renderPlacements();
  }


  /* scan point */
  root.querySelectorAll("[data-scan-point]").forEach(el=>el.addEventListener("click",()=>{
    state.qrScanPoint=el.dataset.scanPoint;state.scanDone=false;state.scanAutoFull=false;render();
  }));
  const cancelScan=root.querySelector("#btn-cancel-scan");
  if(cancelScan)cancelScan.addEventListener("click",()=>{state.qrScanPoint=null;state.scanDone=false;render();});
  bindForm("#scan-form",async e=>{
    const fd=new FormData(e.target);const res=root.querySelector("#scan-result");
    if(!RATE.check("qr-scan",5,60000)){res.innerHTML=`<div class="msg err">For mange scanninger. Vent et minut.</div>`;return;}
    const member=findMember(fd.get("lookup"));
    if(!member||member.status!=="active"){res.innerHTML=`<div class="msg err">Intet aktivt medlem fundet.</div>`;return;}
    const lk=isLocked(member.id);if(lk){res.innerHTML=`<div class="msg err">Konto låst.</div>`;return;}
    if(member.pinHash){const ph=await hashPIN(fd.get("pin"),member.pinSalt||"PPP2026");if(ph!==member.pinHash){await recFail(member.id);res.innerHTML=`<div class="msg err">Forkert PIN.</div>`;return;}}
    const pt=(state.qrpoints||[]).find(p=>p.id===state.qrScanPoint);
    if(!pt){res.innerHTML=`<div class="msg err">Afleveringspunkt ikke fundet.</div>`;return;}
    pt.count=(pt.count||0)+1;
    const autoFull=(pt.count>=(pt.autoFullAt||50));
    if(autoFull){
      state.fullreports.push({id:uid(),memberNumber:"QR-PUNKT",region:pt.region,type:"fuld",note:`Auto-fuld: ${pt.name} (${pt.count} afleveringer)`,date:new Date().toISOString(),handled:false});
      await sset(SKEY.fullreports,state.fullreports);
      await addLog(state.contacts[pt.region]||"",`Auto-fuld: ${pt.name}`,`Automatisk meldt fuld ved ${pt.count} afleveringer.`);
    }
    await sset("qr-drop-points",state.qrpoints);
    await addLog(state.contacts[pt.region]||"",`Aflevering — ${pt.name}`,`${member.name} (${member.number}) afleverede pant. Samlet: ${pt.count}.`);
    state.scanDone=true;state.scanAutoFull=autoFull;state.qrScanPoint=null;render();
  });

  /* qrpoint admin */
  bindForm("#qrpoint-form",async e=>{
    const fd=new FormData(e.target);
    if(!state.qrpoints)state.qrpoints=[];
    state.qrpoints.push({id:uid(),name:fd.get("name"),address:fd.get("address"),postal:fd.get("postal"),city:fd.get("city"),region:fd.get("region"),autoFullAt:parseInt(fd.get("autoFullAt")||"50",10),count:0,createdDate:new Date().toISOString()});
    await sset("qr-drop-points",state.qrpoints);render();
  });
  root.querySelectorAll("[data-reset-qr]").forEach(el=>el.addEventListener("click",async()=>{
    const pt=(state.qrpoints||[]).find(p=>p.id===el.dataset.resetQr);if(pt){pt.count=0;await sset("qr-drop-points",state.qrpoints);render();}
  }));
  root.querySelectorAll("[data-del-qr]").forEach(el=>el.addEventListener("click",async()=>{
    state.qrpoints=(state.qrpoints||[]).filter(p=>p.id!==el.dataset.delQr);await sset("qr-drop-points",state.qrpoints);render();
  }));

  /* import/backup */
  const dz=root.querySelector("#import-drop-zone");
  const fi=root.querySelector("#import-file-input");
  if(dz&&fi){
    dz.addEventListener("click",()=>fi.click());
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.style.borderColor="var(--bottle)";dz.style.background="var(--bottle-light)";});
    dz.addEventListener("dragleave",()=>{dz.style.borderColor="";dz.style.background="";});
    dz.addEventListener("drop",e=>{e.preventDefault();dz.style.borderColor="";dz.style.background="";const f=e.dataTransfer.files[0];if(f)readImport(f);});
    fi.addEventListener("change",()=>{if(fi.files[0])readImport(fi.files[0]);});
  }


  /* jobSub */
  root.querySelectorAll("[data-jobsub]").forEach(el=>el.addEventListener("click",()=>{state.jobSub=el.dataset.jobsub;render();}));

  /* vrijob tilmelding (public) */
  bindForm("#vrijob-form",async e=>{
    const fd=new FormData(e.target);const res=root.querySelector("#vrijob-result");
    const region=getRegion(fd.get("postal"));
    const projects=[...e.target.querySelectorAll("input[name='project']:checked")].map(i=>i.value);
    const sub={id:uid(),name:fd.get("name"),phone:fd.get("phone"),email:fd.get("email"),
      postal:fd.get("postal"),region:region?region.name:"Ukendt",
      projects,avail:fd.get("avail"),note:fd.get("note")||"",date:new Date().toISOString()};
    if(!state.settings.vrijobSubs)state.settings.vrijobSubs=[];
    state.settings.vrijobSubs.push(sub);
    await sset(SKEY.settings,state.settings);
    await addLog(state.settings.ppp.email||"",`Ny frivillig tilmelding`,`${sub.name} fra ${sub.region} tilmeldt som frivillig. Projekter: ${sub.projects.join(", ")||"—"}`);
    res.innerHTML=`<div class="msg ok">Tak, ${sub.name}! Du er nu tilmeldt som frivillig i ${sub.region}. Vi kontakter dig snart.</div>`;
    e.target.reset();const rp=root.querySelector("#region-preview");if(rp)rp.textContent="";
  });

  /* admin: job */
  bindForm("#job-form",async e=>{
    const fd=new FormData(e.target);
    if(!state.settings.jobs)state.settings.jobs=[];
    state.settings.jobs.push({id:uid(),title:fd.get("title"),area:fd.get("area"),type:fd.get("type"),deadline:fd.get("deadline"),desc:fd.get("desc"),email:fd.get("email")});
    await sset(SKEY.settings,state.settings);render();
  });
  root.querySelectorAll("[data-del-job]").forEach(el=>el.addEventListener("click",async()=>{
    state.settings.jobs=(state.settings.jobs||[]).filter((_,i)=>i!==parseInt(el.dataset.delJob));await sset(SKEY.settings,state.settings);render();
  }));

  /* admin: vrijob project */
  bindForm("#vrijob-proj-form",async e=>{
    const fd=new FormData(e.target);
    if(!state.settings.vrijobs)state.settings.vrijobs=[];
    state.settings.vrijobs.push({id:uid(),name:fd.get("name")});
    await sset(SKEY.settings,state.settings);render();
  });
  root.querySelectorAll("[data-del-proj]").forEach(el=>el.addEventListener("click",async()=>{
    state.settings.vrijobs=(state.settings.vrijobs||[]).filter((_,i)=>i!==parseInt(el.dataset.delProj));await sset(SKEY.settings,state.settings);render();
  }));

  /* admin: hjælp */
  bindForm("#hjælp-form",async e=>{
    const fd=new FormData(e.target);
    if(!state.settings.hjælp)state.settings.hjælp=[];
    state.settings.hjælp.push({id:uid(),name:fd.get("name"),category:fd.get("category"),area:fd.get("area"),contact:fd.get("contact"),desc:fd.get("desc")});
    await sset(SKEY.settings,state.settings);render();
  });
  root.querySelectorAll("[data-del-hjælp]").forEach(el=>el.addEventListener("click",async()=>{
    state.settings.hjælp=(state.settings.hjælp||[]).filter((_,i)=>i!==parseInt(el.dataset.delHjælp));await sset(SKEY.settings,state.settings);render();
  }));

  /* admin: partners */
  bindForm("#partner-form",async e=>{
    const fd=new FormData(e.target);
    if(!state.settings.partners)state.settings.partners=[];
    state.settings.partners.push({id:uid(),name:fd.get("name"),text:fd.get("text"),logo:fd.get("logo")});
    await sset(SKEY.settings,state.settings);render();

async function handleSignup(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const region = getRegion(fd.get("postal"));
  const resultDiv = root.querySelector("#signup-result");
  if(!region){ resultDiv.innerHTML = `<div class="msg err">Postnummer ikke genkendt.</div>`; return; }
  const pin1=fd.get("pin1"),pin2=fd.get("pin2");
  if(!/^\d{4}$/.test(pin1)){resultDiv.innerHTML=`<div class="msg err">PIN skal være præcis 4 cifre.</div>`;return;}
  if(pin1!==pin2){resultDiv.innerHTML=`<div class="msg err">PIN-koderne matcher ikke.</div>`;return;}
  resultDiv.innerHTML = `<div class="msg info">Registrerer...</div>`;
  const r = await apiCall('signup', {
    name:fd.get("name"), phone:fd.get("phone"), email:fd.get("email"),
    street:fd.get("street"), postal:fd.get("postal"), city:fd.get("city"),
    region:region.name, regionGroup:region.group,
    containerType:fd.get("ctype")||"privat", storageMode:fd.get("storage")||"beholder",
    smsReminder:fd.get("smsReminder")==="on", pin1, pin2
  });
  if(!r.ok){ resultDiv.innerHTML = `<div class="msg err">${r.message}</div>`; return; }
  const member = {
    id:r.id, number:r.number, status:"active", signupDate:new Date().toISOString(),
    name:fd.get("name"), phone:fd.get("phone"), email:fd.get("email"),
    street:fd.get("street"), postal:fd.get("postal"), city:fd.get("city"),
    region:region.name, regionGroup:region.group,
    containerType:fd.get("ctype")||"privat", storageMode:fd.get("storage")||"beholder",
    smsReminder:fd.get("smsReminder")==="on",
  };
  state.members.push(member); await sset(SKEY.members, state.members);
  resultDiv.innerHTML = `<div class="receipt"><h3>${state.lang==='en'?'Sign-up confirmed':'Tilmelding bekræftet'}</h3><div class="num">${r.number}</div>
    <div class="line"><span>${t('lbl_name')}</span><b>${member.name}</b></div>
    <div class="line"><span>${state.lang==='en'?'Area':'Område'}</span><b>${member.region}</b></div>
    <div class="line"><span>${t('lbl_storage')}</span><b>${storageLabelShort(member.storageMode)}</b></div>
    <div class="line"><span>${state.lang==='en'?'Address':'Adresse'}</span><b>${member.street}, ${member.postal} ${member.city}</b></div></div>
    <div class="msg ok">${state.lang==='en'?`Member number: <b>${r.number}</b> — remember your PIN. Confirmation email sent.`:`Gem dit nummer: <b>${r.number}</b> — husk din PIN-kode. Bekræftelse sendt på e-mail.`}</div>`;
  e.target.reset(); const rp = root.querySelector("#region-preview"); if(rp) rp.textContent="";
}

    region:region.name, regionGroup:region.group, containerType:"andet", storageMode:"egen",
  };
  state.members.push(member); await sset(SKEY.members, state.members);
  await addLog(state.contacts[region.name], `Bruger-nr. bestilt uden beholder — ${region.name}`,
    `${member.name} (${member.number}) har fået tildelt bruger-/medlemsnummer uden fysisk beholder. Bruger egen opbevaring — sække sættes ved vejen på tømningsdag.`);
  resultDiv.innerHTML = `<div class="receipt"><h3>Nummer tildelt</h3><div class="num">${member.number}</div>
    <div class="line"><span>Navn</span><b>${member.name}</b></div><div class="line"><span>Område</span><b>${member.region}</b></div>
    <div class="line"><span>Opbevaring</span><b>Egen (sække ved vejen)</b></div></div>
    <div class="msg ok">Du kan nu sætte sække ved vejen på jeres faste tømningsdag.</div>`;
  e.target.reset(); const rp = root.querySelector("#region-preview"); if(rp) rp.textContent="";
}
async function handleOrgSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const resultDiv = root.querySelector("#org-result");
  const region = getRegion(fd.get("postal"));
  if(!region){ resultDiv.innerHTML = `<div class="msg err">Postnummeret blev ikke genkendt.</div>`; return; }
  const qty = Math.max(1, Math.min(50, parseInt(fd.get("qty")||"1",10)));
  const base = await nextOrgBaseNumber();
  const isEvent = fd.get("type")==="event";
  const shared = {
    baseNumber:base, type:fd.get("type"), orgName:fd.get("orgName")||"", cvr:fd.get("cvr")||"",
    contact:fd.get("contact"), email:fd.get("email"), phone:fd.get("phone"),
    street:fd.get("street"), postal:fd.get("postal"), city:fd.get("city"),
    region:region.name, isEvent, eventName:fd.get("eventName")||"", eventDate:fd.get("eventDate")||"",
    status:"active", createdDate:new Date().toISOString(),
  };
  const created = [];
  for(let i=1;i<=qty;i++){
    const entry = {...shared, id:uid(), suffix:i, fullNumber:`${base}-${i}`, placement: fd.get("placement_"+i) || ""};
    state.orgcontainers.push(entry); created.push(entry);
  }
  await sset(SKEY.orgcontainers, state.orgcontainers);
  const summary = created.map(c=>`${c.fullNumber}${c.placement ? " ("+c.placement+")" : ""}`).join(", ");
  const displayName = shared.orgName || shared.eventName || "Ukendt";
  await addLog(state.contacts[region.name], `Storindsamling/mærkebærer — ${displayName} (${region.name})`,
    `${displayName} har fået tildelt ${qty} beholder(e): ${summary}. Kontakt: ${shared.contact}, ${shared.phone}, ${shared.email}. Adresse: ${shared.street}, ${shared.postal} ${shared.city}.`);
  resultDiv.innerHTML = `<div class="receipt"><h3>Mærkebærer tilmeldt</h3><div class="num">${base}</div>
    <div class="line"><span>Navn</span><b>${displayName}</b></div>
    <div class="line"><span>Område</span><b>${shared.region}</b></div>
    <div class="line"><span>Antal beholdere</span><b>${qty}</b></div>
    ${created.map(c=>`<div class="line"><span>${c.fullNumber}</span><b>${c.placement||"—"}</b></div>`).join("")}
    </div>
    <div class="msg ok">I er nu registreret som mærkebærer. Besked om levering er registreret til jeres område.</div>`;
  e.target.reset();
  const rp = root.querySelector("#region-preview"); if(rp) rp.textContent="";
  const ef = root.querySelector("#event-fields"); if(ef) ef.style.display="none";
  const box = root.querySelector("#org-placements");
  if(box) box.innerHTML = `<label>Placering pr. beholder (valgfrit)</label><input name="placement_1" placeholder="Beholder 1 — fx ved hovedindgang" style="margin-bottom:8px;"/>`;
}


function readImport(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const bk=JSON.parse(e.target.result);
      const pa=root.querySelector("#import-preview-area");
      if(pa)pa.innerHTML=`<div class="card tint" style="margin-top:14px;">
      <span class="eyebrow">Forhåndsvisning</span>
      <div class="receipt">
      <div class="line"><span>Eksporteret</span><b>${new Date(bk.exportedAt||"").toLocaleString("da-DK")}</b></div>
      <div class="line"><span>Medlemmer</span><b>${(bk.members||[]).length}</b></div>
      <div class="line"><span>Firma/Event</span><b>${(bk.orgcontainers||[]).length}</b></div>
      <div class="line"><span>Beløb-poster</span><b>${(bk.collections||[]).length}</b></div>
      <div class="line"><span>Log-poster</span><b>${(bk.log||[]).length}</b></div>
      </div>
      <div class="msg warn">⚠️ Dette overskriver ALLE nuværende data. Er du sikker?</div>
      <button class="btn green" id="btn-confirm-import">Gendan fra denne backup</button>
      <button class="btn ghost" id="btn-cancel-import" style="margin-left:8px;">Annuller</button>
      </div>`;
      // bind confirm
      const ci=root.querySelector("#btn-confirm-import");
      if(ci)ci.addEventListener("click",async()=>{
        state.members=bk.members||[];state.orgcontainers=bk.orgcontainers||[];
        state.contacts=bk.contacts||{};state.calendar=bk.calendar||[];
        state.collections=bk.collections||[];state.log=bk.log||[];
        state.fullreports=bk.fullreports||[];state.news=bk.news||[];
        state.qrpoints=bk.qrpoints||[];
        if(bk.settings)state.settings={...state.settings,...bk.settings};
        await sset(SKEY.members,state.members);await sset(SKEY.contacts,state.contacts);
        await sset(SKEY.calendar,state.calendar);await sset(SKEY.collections,state.collections);
        await sset(SKEY.log,state.log);await sset(SKEY.fullreports,state.fullreports);
        await sset("qr-drop-points",state.qrpoints);await sset(SKEY.settings,state.settings);
        render();alert("Data gendannet fra backup!");
      });
      const cc=root.querySelector("#btn-cancel-import");
      if(cc)cc.addEventListener("click",()=>{if(pa)pa.innerHTML="";});
    }catch(err){alert("Filen kunne ikke læses. Tjek at det er en gyldig .json backup-fil.");}
  };
  reader.readAsText(file);
}

loadAll();
</script>
